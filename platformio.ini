[platformio]
default_envs = esp32s3

[env:config_wifi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
monitor_speed = 115200
build_src_filter = +<../config_wifi.cpp>

[env:test_serial]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
build_src_filter = +<../test_serial.cpp>

[env:test_audio]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -I.
lib_deps =
    Wire
build_src_filter = +<../test_audio.cpp> +<audio/ES8311.cpp>

[env:esp32s3]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino

# Flash and CPU settings
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

# PSRAM settings - Enable 8MB PSRAM
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 16MB

# Upload and monitor settings
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

# Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I ${PIOHOME_DIR}/packages/framework-arduinoespressif32/tools/sdk/esp32s3/qio_opi/include
    -Wall
    -Wextra
    -std=gnu++17

# C++ standard
build_unflags = -std=gnu++11

# Build source filter - include all sources
build_src_filter = +<*>

# Dependencies
lib_deps =
    # Network libraries
    knolleary/PubSubClient@^2.8
    # AsyncUDP is built into ESP32 Arduino framework

    # Audio processing
    https://github.com/pschatzmann/arduino-audio-tools.git#main
    https://github.com/pschatzmann/arduino-libopus.git

    # UI/Display libraries - Waveshare ESP32-S3 1.8" AMOLED
    lvgl/lvgl@^8.3.11
    moononournation/GFX Library for Arduino@1.4.9
    # Arduino_DriveBus library is in lib/ folder (for FT3168 touch)

    # Storage and utilities
    bblanchon/ArduinoJson@^6.21.5

    # Button handling (for physical buttons if needed)
    mathertel/OneButton@^2.5.0

# Extra scripts for build customization
# Note: Config generation is handled by build.sh script
extra_scripts =
