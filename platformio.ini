[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

# Partition scheme - using 16MB flash with space for app and SPIFFS
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

# Enable PSRAM for large buffers (audio, UI framebuffers)
board_build.arduino.memory_type = qio_opi_psram

# Upload and monitor settings
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

# Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -Wall
    -Wextra

# Dependencies
lib_deps =
    # Network libraries
    knolleary/PubSubClient@^2.8
    me-no-dev/AsyncUDP@^0.1.0
    me-no-dev/ESPAsyncWebServer@^1.2.3

    # Audio processing
    https://github.com/pschatzmann/arduino-audio-tools.git#main
    https://github.com/pschatzmann/arduino-libopus.git

    # UI/Display libraries
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43

    # Storage and utilities
    bblanchon/ArduinoJson@^6.21.5

    # Button handling (for physical buttons if needed)
    mathertel/OneButton@^2.5.0

# Extra scripts for build customization
extra_scripts =

# C++ standard
build_unflags = -std=gnu++11
build_flags =
    ${env:esp32s3.build_flags}
    -std=gnu++17
